<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <header>
        <h1>FORMULÁRIO</h1>
    </header>
    <nav>
        <a href="1.html">INÍCIO</a> |
        <a href="2.html">TABELA 3X3</a>
    </nav>
    <hr>
    <main>
        <section>
            <h3>Coloque suas informações aqui:</h3>
            <p>* Email: <input type="email" required placeholder="exemplo@gmail.com"></p>
            <p>* Senha: <input type="password" required placeholder="coloque uma senha segura"></p>
        </section>
        <hr>
        <section>
            <h3>Data e hora:</h3>
            <p><input type="datetime-local"></p>
        </section>
        <hr>
        <section>
            <h3>Qual nota você daria a site?</h3>
            <p><input type="range" value="0" min="0" max="10"></p>
            <p>De 0 a 10</p>
        </section>
    </main>
    <hr>
    <aside>
        <figure>
            <audio src="../audio/Thru the Walls (Instrumental).mp3" controls></audio>
            <figcaption>Escute a uma música enquanto preenche o formulário</figcaption>
        </figure>
    </aside>
    <hr>
    <footer>
        @ 28/09/2026
    </footer>

</body>

</html>
